        /* =========================================================

        function useScrollReveal() {
            React.useEffect(() => {
                const obs = new IntersectionObserver((entries) => {
                    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target) } });
                }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
                document.querySelectorAll('.sr').forEach(el => obs.observe(el));
                return () => obs.disconnect();
            });
        }
        function useScrollY() {
            const [y, setY] = React.useState(0);
            React.useEffect(() => {
                let raf; const h = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => setY(window.scrollY)) };
                window.addEventListener('scroll', h, { passive: true }); return () => { window.removeEventListener('scroll', h); cancelAnimationFrame(raf) };
            }, []); return y;
        }

        /* =========================================================
           TESTIMONIALS
           ========================================================= */
        function Testimonials() {
            const [active, setActive] = React.useState(0);
            const trackRef = React.useRef(null);
            const dragRef = React.useRef({ on: false, sx: 0, ct: 0, st: 0 });
            const timerRef = React.useRef(null);

            const cw = () => { if (!trackRef.current) return 400; const c = trackRef.current.children[0]; return c ? (c.offsetWidth + 24) : 400 };
            const go = (idx) => { setActive(Math.max(0, Math.min(idx, CONFIG.testimonials.length - 1))) };
            const next = () => go(active + 1 > CONFIG.testimonials.length - 1 ? 0 : active + 1);

            React.useEffect(() => { timerRef.current = setInterval(next, 5000); return () => clearInterval(timerRef.current) }, [active]);

            const onDS = (e) => { clearInterval(timerRef.current); const cx = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX; dragRef.current = { on: true, sx: cx, ct: -active * cw(), st: -active * cw() }; if (trackRef.current) trackRef.current.style.transition = 'none' };
            const onDM = (e) => { if (!dragRef.current.on) return; const cx = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX; dragRef.current.ct = dragRef.current.st + (cx - dragRef.current.sx); if (trackRef.current) trackRef.current.style.transform = `translateX(${dragRef.current.ct}px)` };
            const onDE = () => { if (!dragRef.current.on) return; dragRef.current.on = false; if (trackRef.current) trackRef.current.style.transition = 'transform .6s cubic-bezier(.25,.46,.45,.94)'; const d = dragRef.current.ct - dragRef.current.st; if (d < -60) go(active + 1); else if (d > 60) go(active - 1); else go(active); timerRef.current = setInterval(next, 5000) };

            return (
                <section className="bg-ob-midnight py-20 md:py-28 overflow-hidden relative">
                    <div className="blue-glow left-1/4 top-0 opacity-25" />
                    <div className="max-w-[1400px] mx-auto px-6 mb-12 md:mb-16 relative z-10">

                            What Our Clients Say.
                        </h2>
                    </div>
                    <div className="sr sr-d2 pl-6 md:pl-[calc((100vw-1400px)/2+24px)] overflow-hidden relative z-10"
                        onMouseDown={onDS} onMouseMove={onDM} onMouseUp={onDE} onMouseLeave={onDE}
                        onTouchStart={onDS} onTouchMove={onDM} onTouchEnd={onDE}>
                        <div className="test-track" ref={trackRef} style={{ transform: `translateX(${-active * cw()}px)` }}>
                            {CONFIG.testimonials.map((t, i) => (
                                <div key={i} className="shrink-0 w-[300px] sm:w-[360px] md:w-[420px] bg-ob-navy border border-ob-border p-6 md:p-8 flex flex-col justify-between min-h-[220px]">

                                    <div>

                                        <p className="font-body text-xs text-ob-dim mt-1">{t.service} — {t.location}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="flex items-center justify-center gap-2 mt-8 relative z-10">
                        {CONFIG.testimonials.map((_, i) => (
                            <button key={i} onClick={() => go(i)} className={`h-2 rounded-full transition-all duration-300 ${i === active ? 'bg-ob-accent w-6' : 'bg-ob-border-hover w-2 hover:bg-ob-accent/40'}`} aria-label={`Go to testimonial ${i + 1}`} />

                                    <a href={telLink()} className="contact-link group">
                                        <span className="cl-icon text-ob-dim transition-colors duration-300"><PhoneIcon /></span>
                                        <div><p className="font-heading text-sm font-semibold text-white">Phone</p><p className="font-body text-xs text-ob-text">Call our team</p></div>
                                        <span className="cl-arrow ml-auto text-ob-dim opacity-0 transition-all duration-300"><ArrowRight /></span>
                                    </a>
                                    <a href={mailLink()} className="contact-link group">
                                        <span className="cl-icon text-ob-dim transition-colors duration-300"><MailIcon /></span>
                                        <div><p className="font-heading text-sm font-semibold text-white">Email</p><p className="font-body text-xs text-ob-text">Send an enquiry</p></div>
                                        <span className="cl-arrow ml-auto text-ob-dim opacity-0 transition-all duration-300"><ArrowRight /></span>
                                    </a>
                                </div>
                                <div className="sr sr-d2 mt-10 p-6 bg-ob-navy border border-ob-border relative overflow-hidden">
                                    <div className="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-ob-glow opacity-60" />
                                    <p className="font-body text-xs text-ob-accent uppercase tracking-wider mb-3 relative z-10">Fastest Response</p>
                                    <a href={waLink('Hello OCTAGON, I need a fast response about a technology installation. Please let me know how you can help.')} target="_blank" rel="noopener" className="btn-wa w-full justify-center text-sm relative z-10">
                                        <WaIcon s={18} /> CHAT ON WHATSAPP
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        /* =========================================================
           FOOTER
           ========================================================= */
        function Footer({ onQuote }) {
            const links = [{ label: 'Services', href: '#services' }, { label: 'Projects', href: '#projects' }, { label: 'About', href: '#about' }, { label: 'Contact', href: '#contact' }];
            return (
                <footer className="bg-ob-deep border-t border-ob-border pt-16 pb-8">
                    <div className="max-w-[1400px] mx-auto px-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-10 mb-14">
                            <div>
                                <img src="logo.jpg" alt="OCTAGON logo" className="brand-logo footer-logo mb-3" />
                                <p className="font-body text-sm text-ob-dim leading-relaxed">{CONFIG.tagline}</p>
                            </div>
                            <div>
                                <p className="font-body text-xs tracking-[0.2em] text-ob-accent/60 uppercase mb-4">Navigation</p>
                                <div className="flex flex-col gap-2.5">
                                    {links.map(l => (<a key={l.href} href={l.href} className="font-body text-sm text-ob-muted hover:text-white transition-colors duration-300 no-underline">{l.label}</a>))}
                                    <a href={waLink('Hello OCTAGON, I would like to contact your team about a technology installation.')} target="_blank" rel="noopener" className="font-body text-sm text-ob-muted hover:text-white transition-colors duration-300 no-underline">WhatsApp</a>
                                </div>
                            </div>
                            <div>
                                <p className="font-body text-xs tracking-[0.2em] text-ob-accent/60 uppercase mb-4">Social</p>
                                <div className="flex gap-3">
                                    <a href={CONFIG.social.instagram} target="_blank" rel="noopener" className="w-10 h-10 border border-ob-border flex items-center justify-center text-ob-muted hover:text-ob-accent hover:border-ob-border-hover transition-all duration-300" aria-label="Instagram"><IgIcon /></a>
                                    <a href={CONFIG.social.facebook} target="_blank" rel="noopener" className="w-10 h-10 border border-ob-border flex items-center justify-center text-ob-muted hover:text-ob-accent hover:border-ob-border-hover transition-all duration-300" aria-label="Facebook"><FbIcon /></a>
                                    <a href={waLink('Hello OCTAGON, I would like to contact your team about a technology installation.')} target="_blank" rel="noopener" className="w-10 h-10 border border-ob-border flex items-center justify-center text-ob-muted hover:text-ob-accent hover:border-ob-border-hover transition-all duration-300" aria-label="WhatsApp"><WaIcon /></a>
                                    <a href={telLink()} className="w-10 h-10 border border-ob-border flex items-center justify-center text-ob-muted hover:text-ob-accent hover:border-ob-border-hover transition-all duration-300" aria-label="Call OCTAGON"><PhoneIcon /></a>
                                </div>
                            </div>
                        </div>
                        <div className="border-t border-ob-border pt-6 flex flex-col sm:flex-row items-center justify-between gap-3">
                            <p className="font-body text-xs text-ob-dim">&copy; 2026 {CONFIG.company}. All rights reserved.</p>
                            <button onClick={onQuote} className="font-body text-xs text-ob-muted hover:text-ob-accent transition-colors duration-300 cursor-pointer bg-transparent border-none">Request a Quote</button>
                        </div>
                    </div>
                </footer>
            );
        }

        /* =========================================================
           MOBILE STICKY CTA
           ========================================================= */
        function MobileStickyCTA({ visible, onQuote }) {
            if (!visible) return null;
            return (
                <div className="fixed bottom-0 left-0 right-0 z-[7000] bg-ob-deep/95 backdrop-blur-xl border-t border-ob-border-hover px-4 py-3 flex gap-3 lg:hidden" style={{ animation: 'fadeInUp .3s ease both' }}>
                    <button onClick={onQuote} className="btn-p flex-1 justify-center text-xs py-3">REQUEST A QUOTE</button>
                    <a href={waLink('Hello OCTAGON, I would like to discuss a technology installation for my home or business.')} target="_blank" rel="noopener" className="btn-wa flex-1 justify-center text-xs py-3"><WaIcon s={14} /> WHATSAPP</a>
                </div>
            );
        }

        /* =========================================================
           FLOATING WHATSAPP — DESKTOP
           ========================================================= */
        function FloatingWhatsApp() {
            return (
                <a href={waLink('Hello OCTAGON, I would like to chat about a technology installation.')} target="_blank" rel="noopener" className="fixed bottom-6 right-6 z-[7000] w-12 h-12 bg-[#25D366] rounded-full flex items-center justify-center text-white shadow-lg shadow-[#25D36633] hover:scale-110 transition-transform duration-300 hidden lg:flex" aria-label="Chat on WhatsApp">
                    <WaIcon s={22} />
                </a>
            );
        }

        /* =========================================================
           APP
           ========================================================= */
        function App() {
            const scrollY = useScrollY();
            const scrolled = scrollY > 60;
            const [mobileMenu, setMobileMenu] = React.useState(false);
            const [selectedProject, setSelectedProject] = React.useState(null);
            const [showMobileCTA, setShowMobileCTA] = React.useState(false);
            const contactRef = React.useRef(null);

            useScrollReveal();

            React.useEffect(() => { setShowMobileCTA(scrollY > window.innerHeight * 0.8) }, [scrollY]);
            React.useEffect(() => { document.body.style.overflow = mobileMenu ? 'hidden' : ''; return () => { document.body.style.overflow = '' } }, [mobileMenu]);

            const scrollToContact = () => { contactRef.current?.scrollIntoView({ behavior: 'smooth' }) };

            /* Re-observe after state changes */
            React.useEffect(() => {
                const t = setTimeout(() => {
                    const obs = new IntersectionObserver((entries) => {
                        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target) } });
                    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
                    document.querySelectorAll('.sr:not(.visible)').forEach(el => obs.observe(el));
                    return () => obs.disconnect();
                }, 150); return () => clearTimeout(t);
            });

            return (
                <>
                    <Grain scrollY={scrollY} />
                    <Starfield />
                    <Navbar scrolled={scrolled} onQuote={scrollToContact} onMenuToggle={() => setMobileMenu(true)} />
                    {mobileMenu && <MobileMenu onClose={() => setMobileMenu(false)} onQuote={() => { setMobileMenu(false); setTimeout(scrollToContact, 100) }} />}
                    <Hero scrollY={scrollY} onQuote={scrollToContact} />
                    <TrustStrip />
                    <Services />
                    <Projects onProjectClick={setSelectedProject} />
                    {selectedProject && <ProjectModal project={selectedProject} onClose={() => setSelectedProject(null)} />}
                    <WhyOctagon />
                    <HowItWorks />
                    <About />
                    <Testimonials />
                    <FinalCTA onQuote={scrollToContact} />
                    <div ref={contactRef} />
                    <ContactForm />
                    <Footer onQuote={scrollToContact} />
                    <MobileStickyCTA visible={showMobileCTA} onQuote={scrollToContact} />
                    <FloatingWhatsApp />
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
